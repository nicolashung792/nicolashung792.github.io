<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 232" role="img" aria-labelledby="title desc">
  <title id="title">Compatible residue classes</title>
  <desc id="desc">The root splits into 0 and 1 modulo 2. These split into 0, 2 and 1, 3 modulo 4; their children modulo 8 are 0, 4, 2, 6, 1, 5, 3, 7. Each child reduces to its parent.</desc>
  <g fill="none" stroke="#b5c7df" stroke-width="1.4"><path d="M210 24 110 73M210 24 310 73M110 73 60 130M110 73 160 130M310 73 260 130M310 73 360 130M60 130 35 187M60 130 85 187M160 130 135 187M160 130 185 187M260 130 235 187M260 130 285 187M360 130 335 187M360 130 385 187"/></g>
  <path d="M210 24 310 73 260 130 285 187" fill="none" stroke="#2556a8" stroke-width="2.3"/>
  <g fill="#f4f7fc" stroke="#96afcf" stroke-width="1.2"><circle cx="210" cy="24" r="6"/><circle cx="110" cy="73" r="15"/><circle cx="310" cy="73" r="15"/><circle cx="60" cy="130" r="15"/><circle cx="160" cy="130" r="15"/><circle cx="260" cy="130" r="15"/><circle cx="360" cy="130" r="15"/><circle cx="35" cy="187" r="15"/><circle cx="85" cy="187" r="15"/><circle cx="135" cy="187" r="15"/><circle cx="185" cy="187" r="15"/><circle cx="235" cy="187" r="15"/><circle cx="285" cy="187" r="15"/><circle cx="335" cy="187" r="15"/><circle cx="385" cy="187" r="15"/></g>
  <g fill="#2556a8"><circle cx="210" cy="24" r="6"/><circle cx="310" cy="73" r="15"/><circle cx="260" cy="130" r="15"/><circle cx="285" cy="187" r="15"/></g>
  <g font-family="Georgia,serif" font-size="16" text-anchor="middle" fill="#345477"><text x="110" y="79">0</text><text x="310" y="79" fill="#fff">1</text><text x="60" y="136">0</text><text x="160" y="136">2</text><text x="260" y="136" fill="#fff">1</text><text x="360" y="136">3</text><text x="35" y="193">0</text><text x="85" y="193">4</text><text x="135" y="193">2</text><text x="185" y="193">6</text><text x="235" y="193">1</text><text x="285" y="193" fill="#fff">5</text><text x="335" y="193">3</text><text x="385" y="193">7</text></g>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#526b8b"><text x="8" y="77">mod 2</text><text x="8" y="113">mod 4</text><text x="8" y="224">mod 8</text></g>
</svg>
